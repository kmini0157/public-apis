name: Info Radar

# Personal info-monitoring collector. Runs on a schedule, commits new findings
# back to data/items.json, and pushes a digest via ntfy.
on:
  schedule:
    - cron: "0 22 * * *" # 07:00 KST daily (22:00 UTC)
  workflow_dispatch: {} # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: info-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/info-radar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          POLLINATIONS_MODEL: ${{ vars.POLLINATIONS_MODEL }}
        run: node src/collect.mjs

      - name: Commit findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/items.json web/items.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "info-radar: update findings ($(date -u +%Y-%m-%d))"
            git push
          fi
